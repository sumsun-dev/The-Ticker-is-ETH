name: Sync Telegram Data

on:
  schedule:
    - cron: '0 0 * * *' # Daily at UTC 00:00 (KST 09:00)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Telegram data
        run: npx tsx scripts/fetch-telegram.ts
        env:
          CI: 'true'
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # R2 image hosting (optional — uploads are skipped if unset)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: Preprocess Telegram data
        run: npx tsx scripts/preprocess-telegram.ts

      - name: Fetch News RSS
        run: npx tsx scripts/fetch-news.ts

      - name: Fetch ETH news sources
        run: npx tsx scripts/fetch-eth-news.ts
        env:
          CI: 'true'
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # RapidAPI Twitter (twitter-api45) — 시크릿 미설정 시 트위터 수집은 자동 스킵
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/telegram-contributors.json src/data/team-enrichment.json src/data/research-index.json src/data/articles/ src/data/news-feed.json src/data/eth-news-inbox.json
          git diff --cached --quiet || (git commit -m "chore: sync telegram & news data [automated]" && git push)
