name: Sync Telegram Data

on:
  schedule:
    # 22:00 UTC (KST 07:00): 00:00 정각은 GH 스케줄 혼잡으로 3~4시간 지연돼
    # VPS 다이제스트(00:40 UTC)가 하루 묵은 인박스를 쓰게 됨. 지연을 감안해 앞당김.
    - cron: '0 22 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

# 동일 텔레그램 세션을 두 실행이 동시에 쓰면 AUTH_KEY_DUPLICATED로 세션이 깨진다
concurrency:
  group: sync-telegram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 세션 장애 시 재시도 루프로 몇 시간씩 매달리는 것 방지. 단계별 상한(아래)의 합보다 여유 있게
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Telegram data
        run: npx tsx scripts/fetch-telegram.ts
        # 텔레그램 세션 장애가 뉴스 수집까지 막지 않도록 실패 허용.
        # 단계 상한이 없으면 세션 행(gramjs TIMEOUT)이 잡 전체 상한을 먹어 뒤 단계(ETH 뉴스·Forkcast 수집)까지 취소된다
        # (2026-09-08 실측: 30분 취소로 다이제스트에 콜 섹션 누락).
        continue-on-error: true
        timeout-minutes: 25
        env:
          CI: 'true'
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # R2 image hosting (optional — uploads are skipped if unset)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: Preprocess Telegram data
        run: npx tsx scripts/preprocess-telegram.ts
        continue-on-error: true
        timeout-minutes: 5

      - name: Fetch News RSS
        run: npx tsx scripts/fetch-news.ts

      - name: Fetch ETH news sources
        run: npx tsx scripts/fetch-eth-news.ts
        # 스크립트가 TWITTER_BUDGET_MS(기본 20분)에서 스스로 수집을 접고 기록하므로
        # 이 상한은 그 뒤 단계(포크캐스트·기록)를 위한 여유분이다. 여기서 잘리면 수집분이 전량 폐기된다
        timeout-minutes: 25
        env:
          CI: 'true'
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # RapidAPI Twitter (twitter-api45) — 시크릿 미설정 시 트위터 수집은 자동 스킵
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}

      # 다이제스트 생성·송출은 VPS 크론(scripts/vps/run-eth-digest.sh)에서 헤드리스로 처리
      # 수집 단계가 하나 실패해도 그때까지 모은 데이터는 남긴다.
      # always()이므로 잡은 여전히 빨간불로 남아 실패 신호는 유지된다 (2026-09-18: 수집 성공분 전량 유실)
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/telegram-contributors.json src/data/team-enrichment.json src/data/research-index.json src/data/articles/ src/data/news-feed.json src/data/eth-news-inbox.json src/data/eth-digests.json
          git diff --cached --quiet || (git commit -m "chore: sync telegram & news data [automated]" && git pull --rebase origin main && git push)
