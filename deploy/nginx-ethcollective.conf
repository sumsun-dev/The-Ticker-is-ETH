# /etc/nginx/sites-available/ethcollective.xyz
# HTTPS 블록은 DNS 전환 후 certbot --nginx 가 자동 추가

server {
    listen 80;
    listen [::]:80;
    server_name ethcollective.xyz www.ethcollective.xyz;

    root /var/www/ethcollective;
    index index.html;

    # vercel.json headers 이전 — nginx add_header는 location에서 재정의 시
    # 상위 것이 사라지므로 각 location마다 include
    location /api/ {
        include snippets/ethcollective-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        include snippets/ethcollective-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include snippets/ethcollective-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
