# /etc/nginx/sites-available/ethcollective.xyz
# 인증서는 certbot(ethcollective.xyz + www) 발급본 사용. 갱신은 certbot systemd timer가 자동 처리.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ethcollective.xyz;

    ssl_certificate /etc/letsencrypt/live/ethcollective.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ethcollective.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/ethcollective;
    index index.html;

    # vercel.json headers 이전 — nginx add_header는 location에서 재정의 시
    # 상위 것이 사라지므로 각 location마다 include
    location /api/ {
        include snippets/ethcollective-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        include snippets/ethcollective-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include snippets/ethcollective-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # $uri/ 대신 $uri/index.html — 디렉터리 301 리다이렉트 없이 SEO 셸 직접 서빙 (Vercel과 동일 동작)
        try_files $uri $uri/index.html /index.html;
    }
}

# www → apex 301 (SEO 중복 콘텐츠 방지, Vercel 시절과 동일)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ethcollective.xyz;

    ssl_certificate /etc/letsencrypt/live/ethcollective.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ethcollective.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://ethcollective.xyz$request_uri;
}

# HTTP → HTTPS (www는 바로 apex로)
server {
    listen 80;
    listen [::]:80;
    server_name ethcollective.xyz www.ethcollective.xyz;
    return 301 https://ethcollective.xyz$request_uri;
}
