<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="ECK"
>
  <title>ECK</title>
  <!--
    ECK icon — Ethereum diamond with Korean tricolor on the top facets.
    Light/dark adapts via prefers-color-scheme (bottom facets only;
    top facets carry brand color so stay constant).
  -->
  <style>
    .eck-fg { color: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .eck-fg { color: #f1f5f9; }
    }
  </style>
  <g transform="translate(32 32)">
    <!-- Top-left pyramid face: Korea red -->
    <path d="M0,-24 L-16,4 L0,-4 Z" fill="#CD2E3A" />
    <!-- Top-right pyramid face: Korea blue -->
    <path d="M0,-24 L0,-4 L16,4 Z" fill="#0047A0" />
    <!-- Bottom-left tetra face: theme-aware (lighter) -->
    <path class="eck-fg" d="M0,7 L-16,7 L0,27 Z" fill="currentColor" fill-opacity="0.55" />
    <!-- Bottom-right tetra face: theme-aware (darker) -->
    <path class="eck-fg" d="M0,7 L0,27 L16,7 Z" fill="currentColor" fill-opacity="0.9" />
  </g>
</svg>
