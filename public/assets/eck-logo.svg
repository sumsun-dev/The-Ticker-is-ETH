<svg
  width="506"
  height="878"
  viewBox="0 0 506 878"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="ECK — Ethereum Collective Korea"
>
  <title>ECK — Ethereum Collective Korea</title>

  <!--
    Standalone SVG: light/dark adapts via prefers-color-scheme inside the SVG document
    (because <img src="...svg"> does not inherit external currentColor).
  -->
  <style>
    .eck-fg { color: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .eck-fg { color: #f1f5f9; }
    }
  </style>

  <!--
    Gradients were removed: linearGradient stop-color="currentColor" is
    unreliable inside <img src="…svg"> (some WebKit versions fall back to
    black). Facet contrast is now expressed via per-path fill-opacity only,
    which fully inherits the .eck-fg color cascade.
  -->

  <g class="eck-fg">
    <!-- ECK monogram -->
    <text
      x="253"
      y="220"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="200"
      fill="currentColor"
      letter-spacing="-8"
    >ECK</text>

    <!-- divider -->
    <line x1="178" y1="270" x2="328" y2="270" stroke="currentColor" stroke-width="2" stroke-opacity="0.35" />

    <!-- COLLECTIVE label -->
    <text
      x="253"
      y="320"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-weight="500"
      font-size="28"
      fill="currentColor"
      fill-opacity="0.7"
      letter-spacing="8"
    >COLLECTIVE</text>

    <!-- Ethereum diamond centerpiece — facets via fill-opacity, no gradients -->
    <g transform="translate(253 555)">
      <path d="M0,-175 L-130,40 L0,-35 Z" fill="currentColor" fill-opacity="0.72" />
      <path d="M0,-175 L0,-35 L130,40 Z" fill="currentColor" fill-opacity="0.95" />
      <line x1="-130" y1="40" x2="130" y2="40" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.2" />
      <path d="M0,65 L-130,65 L0,225 Z" fill="currentColor" fill-opacity="0.4" />
      <path d="M0,65 L0,225 L130,65 Z" fill="currentColor" fill-opacity="0.6" />
    </g>

    <!-- KOREA wordmark -->
    <text
      x="253"
      y="848"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-weight="700"
      font-size="42"
      fill="currentColor"
      fill-opacity="0.92"
      letter-spacing="12"
    >KOREA</text>
  </g>

  <!-- Korean tricolor accent dots: red · neutral · blue (태극 빨강 / theme-neutral / 태극 파랑) -->
  <circle cx="223" cy="790" r="7" fill="#CD2E3A" />
  <circle cx="253" cy="790" r="7" fill="#94A3B8" />
  <circle cx="283" cy="790" r="7" fill="#0047A0" />
</svg>
